DB_NAME = "examgen"
DB_USER = "postgres"
DB_PASSWORD = "change-me"
DB_HOST = "localhost"
DB_PORT = "5432"

MODEL_CONTEXT_TOKEN_LIMIT = 20000
SAFETY_BUFFER_TOKENS = 2000

SARA_AUTH_PORTAL_URL = "http://localhost:3000"
SARA_IDENTITY_URL = "http://127.0.0.1:8001"
# Debe coincidir byte por byte con el callback registrado para `examgen-web`.
SARA_AUTH_CALLBACK_URL = "http://localhost:8501/"

# Genera una clave Fernet exclusiva siguiendo README; nunca la confirmes en Git.
SARA_AUTH_TRANSACTION_KEY = "replace-with-a-generated-fernet-key"
SARA_AUTH_TRANSACTION_DB = ".data/examgen_auth_transactions.sqlite3"
SARA_AUTH_TRANSACTION_TTL_SECONDS = 300
SARA_AUTH_TRANSACTION_MAX_PENDING = 1000

# Opcional: sólo asociaciones UUID central -> identificador histórico aprobadas.
SARA_LEGACY_IDENTITY_MANIFEST = "legacy_identities.json"

# Fallback administrativo opcional. También se aceptan las capacidades centrales
# `examgen.admin` y `platform.manage`; nunca se autoriza por email o nombre.
SARA_EXAMGEN_ADMIN_UUIDS = [
  "12345678-1234-4234-9234-1234567890ab",
]
